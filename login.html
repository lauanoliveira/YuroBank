<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar - YuroBank</title>

<link rel="stylesheet" href="css/login.css">
</head>
<body>

<video
autoplay
muted
loop
playsinline
preload="auto"
id="video-fundo">

<source
src="assets/videos/video de fundo da floresta.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<div class="login-card">

<img
src="assets/images/logo do yurobank.png"
alt="logo"
class="logo">

<h1>YuroBank</h1>

<p class="subtitulo" id="subtitulo-login">
Bem-vindo de volta
</p>

<input
type="text"
id="usuario"
placeholder="Usuário">

<input
type="password"
id="senha"
placeholder="Senha">

<button id="btn-login">
Entrar
</button>

<button id="btn-cadastro">
Criar Conta
</button>

<p id="mensagem"></p>

</div>

<script src="js/login.js"></script>

</body>
</html>
